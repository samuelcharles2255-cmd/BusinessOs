{% extends "sales/base.html" %}

{% block title %}Password Reset — Biashara OS{% endblock %}

{% block content %}
<div style="max-width: 460px; margin: 3rem auto; padding: 0 1rem;">
  <div class="card" style="padding: 2.25rem; text-align:center;">

    <!-- Success icon -->
    <div style="width:64px; height:64px; border-radius:50%; background:var(--color-success-bg); color:var(--color-success); display:inline-flex; align-items:center; justify-content:center; margin:0 auto 1.25rem;">
      <i data-lucide="shield-check" style="width:30px;height:30px;"></i>
    </div>

    <h1 style="font-size:1.55rem; font-weight:800; margin:0 0 0.5rem; letter-spacing:-0.02em;">Password Reset</h1>
    <p style="color:var(--color-text-muted); font-size:0.92rem; line-height:1.6; margin:0 0 1.5rem;">
      Your password reset request has been processed. You can proceed directly to set a new password or return to sign in.
    </p>

    <div style="display:flex; flex-direction:column; gap:0.75rem;">
      <a href="{% url 'password_reset' %}" class="btn btn-primary" style="width:100%; display:inline-flex; align-items:center; justify-content:center; gap:0.4rem;">
        <i data-lucide="key-round" style="width:15px;height:15px;"></i>
        Reset Password
      </a>
      <a href="{% url 'login' %}" class="btn btn-secondary" style="width:100%; display:inline-flex; align-items:center; justify-content:center; gap:0.4rem;">
        <i data-lucide="arrow-left" style="width:15px;height:15px;"></i>
        Back to Sign In
      </a>
    </div>
  </div>
</div>
{% endblock %}
