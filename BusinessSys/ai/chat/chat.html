<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistant — {{ business.name }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  /* ---------------------------------------------------------------
     Tokens. One accent (ochre), everything else quiet ink-on-paper.
     Figures get the mono face so they read like ledger entries, not
     prose -- that's the one deliberate idea this page is built around.
  --------------------------------------------------------------- */
  :root {
    --paper: #F1E7D0;
    --surface: #FFFDF6;
    --ink: #21281F;
    --ink-soft: #5B6555;
    --teal: #123F3A;
    --teal-deep: #0C2E2A;
    --ochre: #C98A1E;
    --rust: #A64B2A;
    --hairline: rgba(33, 40, 31, 0.14);
    --shell-max: 640px;
    --font-display: 'Fraunces', Georgia, serif;
    --font-sans: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 15.5px;
    line-height: 1.5;
    display: flex;
    justify-content: center;
  }

  .shell {
    width: 100%;
    max-width: var(--shell-max);
    min-height: 100vh;
    background: var(--paper);
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 0 1px var(--hairline);
  }

  /* -------------------------- Header -------------------------- */

  header.bar {
    background: var(--teal);
    color: var(--surface);
    padding: 18px 20px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex: 0 0 auto;
  }

  .mark {
    width: 38px;
    height: 38px;
    border-radius: 9px;
    background: var(--teal-deep);
    border: 1px solid rgba(255, 253, 246, 0.18);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-size: 18px;
    font-weight: 600;
    flex: 0 0 auto;
  }

  .bar-text { flex: 1 1 auto; min-width: 0; }

  .bar-text h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 18px;
    margin: 0 0 1px;
    letter-spacing: 0.1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .bar-text p {
    margin: 0;
    font-size: 12.5px;
    color: rgba(255, 253, 246, 0.72);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #7FD6A8;
    flex: 0 0 auto;
    animation: pulse 2.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  button.reset-btn {
    background: transparent;
    border: 1px solid rgba(255, 253, 246, 0.28);
    color: rgba(255, 253, 246, 0.85);
    font-family: var(--font-sans);
    font-size: 12.5px;
    padding: 7px 12px;
    border-radius: 7px;
    cursor: pointer;
    flex: 0 0 auto;
  }
  button.reset-btn:hover { background: rgba(255, 253, 246, 0.08); }
  button.reset-btn:focus-visible,
  .composer button:focus-visible,
  .chip:focus-visible,
  textarea:focus-visible {
    outline: 2px solid var(--ochre);
    outline-offset: 2px;
  }

  /* -------------------------- Thread -------------------------- */

  main.thread {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 20px 18px 8px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .row { display: flex; gap: 10px; max-width: 100%; }
  .row.user { justify-content: flex-end; }

  .avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--teal);
    color: var(--surface);
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
    margin-top: 2px;
  }

  .bubble {
    max-width: 76%;
    padding: 11px 14px;
    border-radius: 14px;
    font-size: 15px;
    line-height: 1.55;
  }

  .row.assistant .bubble {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-top-left-radius: 4px;
    color: var(--ink);
  }

  .row.user .bubble {
    background: var(--teal);
    color: var(--surface);
    border-top-right-radius: 4px;
  }

  .bubble p { margin: 0 0 8px; }
  .bubble p:last-child { margin-bottom: 0; }

  .bubble .figure {
    font-family: var(--font-mono);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    background: rgba(18, 63, 58, 0.07);
    padding: 1px 5px;
    border-radius: 4px;
  }
  .row.user .bubble .figure {
    background: rgba(255, 253, 246, 0.18);
  }
  .bubble .figure.urgent { color: var(--rust); background: rgba(166, 75, 42, 0.1); }

  .timestamp {
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--ink-soft);
    margin-top: 5px;
    opacity: 0.75;
  }
  .row.user .timestamp { text-align: right; color: rgba(255, 253, 246, 0.65); }

  /* typing indicator -- the one bit of non-user-triggered motion,
     and it's functional: it answers "is it working". */
  .typing-dots { display: inline-flex; gap: 4px; padding: 4px 2px; }
  .typing-dots span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--ink-soft);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  /* -------------------------- Composer -------------------------- */

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    padding: 10px 18px 0;
    flex: 0 0 auto;
  }

  .chip {
    font-family: var(--font-sans);
    font-size: 12.5px;
    color: var(--teal);
    background: rgba(18, 63, 58, 0.07);
    border: 1px solid rgba(18, 63, 58, 0.15);
    padding: 6px 11px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }
  .chip:hover { background: rgba(18, 63, 58, 0.13); }

  form.composer {
    flex: 0 0 auto;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 10px 18px 18px;
  }

  .composer .field {
    flex: 1 1 auto;
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 14px;
    padding: 4px 4px 4px 14px;
    display: flex;
    align-items: flex-end;
  }

  textarea {
    flex: 1 1 auto;
    border: none;
    background: transparent;
    resize: none;
    font-family: var(--font-sans);
    font-size: 15px;
    color: var(--ink);
    padding: 9px 4px;
    max-height: 120px;
  }
  textarea:focus { outline: none; }
  textarea::placeholder { color: var(--ink-soft); }

  .composer button.send {
    background: var(--ochre);
    color: var(--surface);
    border: none;
    width: 38px;
    height: 38px;
    border-radius: 10px;
    margin: 4px;
    flex: 0 0 auto;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .composer button.send:disabled { opacity: 0.45; cursor: default; }
  .composer button.send svg { width: 17px; height: 17px; }

  .footnote {
    text-align: center;
    font-size: 11px;
    color: var(--ink-soft);
    padding: 0 18px 14px;
    flex: 0 0 auto;
  }

  @media (max-width: 480px) {
    .bubble { max-width: 86%; }
    header.bar { padding: 14px 14px 12px; }
    .chips, form.composer { padding-left: 12px; padding-right: 12px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .status-dot, .typing-dots span { animation: none; }
  }
</style>
</head>
<body>

<div class="shell">
  <header class="bar">
    <div class="mark">{{ business.name|slice:":1"|upper }}</div>
    <div class="bar-text">
      <h1>{{ business.name }}</h1>
      <p><span class="status-dot" aria-hidden="true"></span> Business assistant · ready</p>
    </div>
    <button type="button" class="reset-btn" id="resetBtn">New chat</button>
  </header>

  <main class="thread" id="thread" aria-live="polite"></main>

  <div class="chips" id="chips">
    {% for q in example_questions %}
      <button type="button" class="chip" data-question="{{ q }}">{{ q }}</button>
    {% endfor %}
  </div>

  <form class="composer" id="composerForm">
    {% csrf_token %}
    <div class="field">
      <textarea id="messageInput" rows="1" placeholder="Ask about your business…" aria-label="Message"></textarea>
    </div>
    <button type="submit" class="send" id="sendBtn" aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 12L20 4L14 20L11 13L4 12Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      </svg>
    </button>
  </form>
  <p class="footnote">Answers are generated from {{ business.name }}'s own recorded sales, stock, and payments.</p>
</div>

<script>
(function () {
  "use strict";

  const business = { name: {{ business.name|escapejs }}, id: {{ business.id }} };
  const userLabel = {{ user_display_name|default:"You"|escapejs }};
  const askUrl = "{% url 'assistant:ask' business.id %}";
  const resetUrl = "{% url 'assistant:reset' business.id %}";

  const thread = document.getElementById("thread");
  const form = document.getElementById("composerForm");
  const input = document.getElementById("messageInput");
  const sendBtn = document.getElementById("sendBtn");
  const chipsWrap = document.getElementById("chips");
  const resetBtn = document.getElementById("resetBtn");

  function getCookie(name) {
    const match = document.cookie.match("(^|;)\\s*" + name + "\\s*=\\s*([^;]+)");
    return match ? decodeURIComponent(match[2]) : null;
  }
  const csrftoken = getCookie("csrftoken");

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  // Render currency-shaped text ("TZS 1,250,000") in the mono ledger
  // style. Runs AFTER escaping, on a fixed pattern only -- never on
  // arbitrary HTML -- so this can't be used to inject markup.
  function formatFigures(escapedText) {
    return escapedText.replace(
      /TZS\s?-?[\d,]+(\.\d+)?/g,
      (match) => `<span class="figure${match.includes("-") ? " urgent" : ""}">${match}</span>`
    );
  }

  function textToHtml(text) {
    const escaped = escapeHtml(text);
    const withFigures = formatFigures(escaped);
    return withFigures.split(/\n{2,}/).map((para) => `<p>${para.replace(/\n/g, "<br>")}</p>`).join("");
  }

  function timeNow() {
    return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }

  function appendMessage(role, text) {
    const row = document.createElement("div");
    row.className = "row " + role;

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = role === "assistant" ? business.name.charAt(0).toUpperCase() : userLabel.charAt(0).toUpperCase();

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerHTML = textToHtml(text);

    const stamp = document.createElement("div");
    stamp.className = "timestamp";
    stamp.textContent = timeNow();
    bubble.appendChild(stamp);

    if (role === "assistant") {
      row.appendChild(avatar);
      row.appendChild(bubble);
    } else {
      row.appendChild(bubble);
      row.appendChild(avatar);
    }
    thread.appendChild(row);
    thread.scrollTop = thread.scrollHeight;
    return row;
  }

  function showTyping() {
    const row = document.createElement("div");
    row.className = "row assistant";
    row.id = "typingRow";
    row.innerHTML =
      '<div class="avatar">' + business.name.charAt(0).toUpperCase() + '</div>' +
      '<div class="bubble"><span class="typing-dots"><span></span><span></span><span></span></span></div>';
    thread.appendChild(row);
    thread.scrollTop = thread.scrollHeight;
  }

  function hideTyping() {
    const row = document.getElementById("typingRow");
    if (row) row.remove();
  }

  function showWelcome() {
    thread.innerHTML = "";
    appendMessage(
      "assistant",
      "Habari" + (userLabel && userLabel !== "You" ? ", " + userLabel : "") + "! I'm the " + business.name +
      " business assistant. Ask me about profit, sales, stock, or who owes you money — " +
      "I'll check your real records before I answer, every time."
    );
  }

  async function sendMessage(text) {
    input.value = "";
    input.style.height = "auto";
    appendMessage("user", text);
    sendBtn.disabled = true;
    showTyping();

    try {
      const resp = await fetch(askUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-CSRFToken": csrftoken },
        body: JSON.stringify({ message: text }),
      });
      const data = await resp.json();
      hideTyping();
      appendMessage("assistant", data.reply || "Samahani, something went wrong. Please try again.");
    } catch (err) {
      hideTyping();
      appendMessage("assistant", "Samahani, I couldn't reach the assistant service. Please check your connection and try again.");
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    sendMessage(text);
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 120) + "px";
  });

  chipsWrap.addEventListener("click", (e) => {
    const chip = e.target.closest(".chip");
    if (!chip) return;
    sendMessage(chip.dataset.question);
  });

  resetBtn.addEventListener("click", async () => {
    try {
      await fetch(resetUrl, { method: "POST", headers: { "X-CSRFToken": csrftoken } });
    } catch (err) { /* best-effort -- clear the visible thread either way */ }
    showWelcome();
    input.focus();
  });

  showWelcome();
  input.focus();
})();
</script>
</body>
</html>
