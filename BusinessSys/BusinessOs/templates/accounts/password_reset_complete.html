{% extends "sales/base.html" %}

{% block title %}Password Reset Complete — Biashara OS{% endblock %}

{% block content %}
<div class="card" style="max-width: 440px; margin: 3rem auto; padding: 2.5rem; text-align: center;">
  <div class="brand-icon" style="width:52px; height:52px; font-size:1.5rem; margin:0 auto 1.25rem; background:var(--color-profit-bg); color:var(--color-profit);">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
  </div>

  <h1 style="font-size:1.5rem; margin:0 0 0.5rem;">Password Changed!</h1>
  <p style="color:var(--color-text-muted); font-size:0.92rem; line-height:1.55; margin:0 0 1.5rem;">
    Your password has been set successfully. You may now sign in using your new credentials.
  </p>

  <a href="{% url 'login' %}" class="btn btn-primary btn-block btn-lg">
    Sign In to Your Counter &rarr;
  </a>
</div>
{% endblock %}
