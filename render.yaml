databases:
  - name: businessos-postgres
    databaseName: businessos_db
    user: postgres
    plan: free

services:
  - type: web
    name: businessos
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn BusinessSys.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_SETTINGS_MODULE
        value: BusinessSys.settings
      - key: WEB_CONCURRENCY
        value: 2
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: businessos-postgres
          property: connectionString
